# Cloudflare Worker for Rregullo: static assets from dist/ plus the signup routes. See README.md, "Setup".
name = "rregullo"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Served at rregullo.net and www.rregullo.net (Worker custom domains: Cloudflare creates the DNS records and
# the SSL certificates), and still at its workers.dev address. User confirmed connecting the domain on 2026-10-01.
workers_dev = true
preview_urls = false
routes = [
  { pattern = "rregullo.net", custom_domain = true },
  { pattern = "www.rregullo.net", custom_domain = true },
]

# Builds dist/ before every `wrangler deploy` / `versions upload`, so Cloudflare's Git builds work with their default commands.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
# These paths always reach the Worker, even if a static file with the same name ever appears.
run_worker_first = ["/api/*", "/foto/*", "/konfirmo", "/konfirmo/", "/cregjistrohu", "/cregjistrohu/", "/kerko", "/kerko/", "/m/*", "/sitemap.xml", "/vleresimi", "/vleresimi/", "/r/*"]

[observability]
enabled = true

# Non-secret settings. Secrets (APP_SECRET, RESEND_API_KEY, LAUNCH_NOTIFICATION_EMAIL, and the SMS/Turnstile ones) are set with
# `wrangler secret put` or in the dashboard, never here.
[vars]
# The public address every email link points at. `npm run deploy:auto` sets it to the workers.dev URL.
SITE_URL = "https://rregullo.net"
# Until rregullo.net is verified in Resend this is Resend's test sender, which only delivers to the
# Resend account's own address. Switch back to "Rregullo <njoftime@rregullo.net>" once it's verified.
EMAIL_FROM = "Rregullo <onboarding@resend.dev>"
# 'all': the team hears about every signup request and every confirmation. 'confirmed': confirmations only.
# The recipient (LAUNCH_NOTIFICATION_EMAIL) is set as a secret, not here, so it never lands in Git.
LAUNCH_NOTIFY_ON = "all"
# The sender name on mjeshtër sign-in SMS (an alphanumeric sender ID registered with Twilio, a Twilio number, or a
# Messaging Service SID starting with MG). Secrets TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and TURNSTILE_SECRET_KEY are
# set with `wrangler secret put`.
SMS_FROM = "Rregullo"
# The public directory (/kerko and the /m/ profiles) and the homepage's search box. "0": coming soon for the public,
# while the signed-in team can already look at it. Set "1" to open it; the next deploy switches the homepage too.
DIRECTORY_OPEN = "0"

[[d1_databases]]
binding = "DB"
database_name = "rregullo-launch"
# rregullo-launch (weur). `npm run deploy:auto` keeps this in sync.
database_id = "ba8344e4-92f6-4d54-b9cd-e39c6e847caf"
migrations_dir = "migrations"

# Mjeshtër photos (step 2). R2 must be enabled on the Cloudflare account (dashboard > R2); the first deploy then
# creates the bucket by itself. Free up to 10 GB.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "rregullo-foto"

# Worker Previews: Cloudflare's builds for branches other than main run `npx wrangler preview`, which needs this
# block. Previews don't inherit the settings above, and this block deliberately gives them no database, photo storage,
# variables or secrets: a preview shows the pages, while the signup and the mjeshtër sign-in answer with an error there
# instead of touching the real list. With `preview_urls = false` above, previews get no public URL either.
[previews]
