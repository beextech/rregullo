# Cloudflare Worker for Rregullo: static assets from dist/ plus the signup routes. See README.md, "Setup".
name = "rregullo"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Served at its public workers.dev address for now. rregullo.net is not connected yet: when it is,
# add it under Settings > Domains & Routes (or a `routes` entry here) and update SITE_URL.
workers_dev = true
preview_urls = false

# Builds dist/ before every `wrangler deploy` / `versions upload`, so Cloudflare's Git builds work with their default commands.
[build]
command = "node scripts/build.mjs"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
# These paths always reach the Worker, even if a static file with the same name ever appears.
run_worker_first = ["/api/*", "/konfirmo", "/konfirmo/", "/cregjistrohu", "/cregjistrohu/"]

[observability]
enabled = true

# Non-secret settings. Secrets (APP_SECRET, RESEND_API_KEY, LAUNCH_NOTIFICATION_EMAIL) are set with
# `wrangler secret put` or in the dashboard, never here.
[vars]
# The public address every email link points at. `npm run deploy:auto` sets it to the workers.dev URL.
SITE_URL = "https://rregullo.beextech0.workers.dev"
# Until rregullo.net is verified in Resend this is Resend's test sender, which only delivers to the
# Resend account's own address. Switch back to "Rregullo <njoftime@rregullo.net>" once it's verified.
EMAIL_FROM = "Rregullo <onboarding@resend.dev>"
# 'all': the team hears about every signup request and every confirmation. 'confirmed': confirmations only.
# The recipient (LAUNCH_NOTIFICATION_EMAIL) is set as a secret, not here, so it never lands in Git.
LAUNCH_NOTIFY_ON = "all"

[[d1_databases]]
binding = "DB"
database_name = "rregullo-launch"
# rregullo-launch (weur). `npm run deploy:auto` keeps this in sync.
database_id = "ba8344e4-92f6-4d54-b9cd-e39c6e847caf"
migrations_dir = "migrations"
